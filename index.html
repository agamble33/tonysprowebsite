<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tony Gamble · Software Engineer</title>
<meta name="description" content="Tony Gamble, software engineer. Let's talk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  :root{
    --sky:#0b0f2b; --sky2:#1a2352; --ground:#2a7a3b; --dirt:#5a3a1e; --brick:#b5462f;
    --coin:#ffd23f; --ink:#f4f4f0; --muted:#9aa3c7; --box:#f7b733;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:linear-gradient(var(--sky) 0%, var(--sky2) 70%, var(--sky2) 100%);
    color:var(--ink); font-family:"VT323","Courier New",monospace; font-size:24px;
    display:flex; flex-direction:column; min-height:100vh; overflow-x:hidden;
    image-rendering:pixelated;
  }
  .hud{display:flex;justify-content:space-between;padding:16px 20px;font-family:"Press Start 2P",monospace;font-size:11px;color:var(--coin);letter-spacing:.04em}
  .hud span{white-space:nowrap}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px 140px;position:relative}
  .stars{position:absolute;inset:0;pointer-events:none}
  .stars i{position:absolute;width:3px;height:3px;background:#fff;opacity:.8;animation:tw 2.4s infinite}
  @keyframes tw{50%{opacity:.2}}
  h1{font-family:"Press Start 2P",monospace;font-size:clamp(20px,4.5vw,40px);line-height:1.5;margin:0 0 14px;text-shadow:4px 4px 0 #000}
  .sub{font-size:clamp(22px,3vw,32px);color:var(--muted);margin:0 0 30px;text-shadow:2px 2px 0 #000}
  .box{
    display:inline-block;background:var(--box);color:#3a1d00;border:4px solid #000;
    box-shadow:6px 6px 0 #000;padding:14px 26px;font-family:"Press Start 2P",monospace;font-size:clamp(11px,1.8vw,16px);
    text-decoration:none;position:relative;transition:transform .08s
  }
  .box:hover,.box:focus{transform:translate(2px,2px);box-shadow:4px 4px 0 #000;outline:3px solid var(--coin);outline-offset:4px}
  .box::before{content:"?";position:absolute;left:-30px;top:50%;transform:translateY(-50%);width:26px;height:26px;background:var(--coin);border:3px solid #000;color:#000;font-size:14px;line-height:20px;text-align:center}
  .blink{animation:bl 1.1s steps(2) infinite;margin-top:34px;font-size:22px;color:var(--ink)}
  @keyframes bl{50%{opacity:0}}
  .ground{position:fixed;left:0;right:0;bottom:0;height:110px;
    background:
      linear-gradient(var(--ground) 0 28px, transparent 28px) top/100% 28px no-repeat,
      repeating-linear-gradient(90deg,var(--dirt) 0 40px,#4a2f17 40px 80px);
  }
  .ground::before{content:"";position:absolute;top:0;left:0;right:0;height:28px;
    background:repeating-linear-gradient(90deg,transparent 0 30px,#1f5c2c 30px 34px)}
  .hero{position:absolute;bottom:110px;left:8%;width:32px;height:44px;background:
    linear-gradient(#d33 0 12px,#f9c 12px 24px,#33a 24px 40px,#5a3a1e 40px 44px);
    border:3px solid #000;animation:hop 1.8s ease-in-out infinite}
  @keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-38px)}}
  .cloud{position:absolute;background:#fff;border:3px solid #000;height:22px;width:90px;opacity:.9;animation:drift 40s linear infinite}
  .cloud.b{top:22%;left:-120px;animation-duration:55s;width:60px}
  @keyframes drift{to{transform:translateX(120vw)}}
  footer{position:fixed;bottom:118px;right:16px;font-size:16px;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){.hero,.cloud,.stars i,.blink{animation:none}}
</style>
</head>
<body>
<div class="hud"><span>PLAYER 1 · TONY GAMBLE</span><span>ROLE · SOFTWARE ENGINEER</span><span>LIVES · ∞</span></div>
<main>
  <div class="stars" aria-hidden="true">
    <i style="top:8%;left:12%"></i><i style="top:15%;left:70%;animation-delay:.4s"></i><i style="top:30%;left:35%;animation-delay:.9s"></i>
    <i style="top:12%;left:48%;animation-delay:1.3s"></i><i style="top:26%;left:88%;animation-delay:.2s"></i><i style="top:40%;left:8%;animation-delay:1.7s"></i>
  </div>
  <div class="cloud" style="top:14%;left:-100px" aria-hidden="true"></div>
  <div class="cloud b" aria-hidden="true"></div>
  <h1>SOFTWARE ENGINEER</h1>
  <p class="sub">Web, mobile, AI. Twenty years of shipping. Let's talk.</p>
  <a class="box" href="https://calendly.com/goalsandgambles/30min" rel="noopener">BOOK A 30 MIN CALL</a>
  <div class="blink">▶ PRESS START</div>
</main>
<div class="hero" aria-hidden="true"></div>
<div class="ground" aria-hidden="true"></div>
<footer>© 2026 Goals and Gambles LLC</footer>
</body>
</html>
